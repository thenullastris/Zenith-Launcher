name: Release build

on:
  # GitHub does not emit a release event when a release is only saved as a
  # draft. Publishing the release is the reliable automatic build trigger.
  release:
    types: [published]
  # Manual fallback for testing a draft release before publishing it.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag, for example v1.0.3'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  build:
    name: Release build
    strategy:
      matrix:
        include:
          - platform: 2
            platform_name: ios

    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          # Build exactly the commit selected by the release tag.
          ref: ${{ github.event.release.tag_name || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Setup JDK 8 (Zulu)
        uses: actions/setup-java@v5
        id: setup-java
        with:
          distribution: 'zulu'
          java-version: '8'
          architecture: x64

      - name: Install brew dependencies
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew update
          brew install make wget ldid
          sudo mkdir -p /usr/local/bin
          sudo ln -sf /opt/homebrew/bin/gmake /usr/local/bin/gmake

      - name: Cache iOS JREs
        id: cache-jres
        uses: actions/cache@v5
        with:
          path: depends/
          key: amethyst-jres-v1

      - name: Resolve env (paths, SDK)
        run: |
          echo "SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)" >> "$GITHUB_ENV"
          echo "RUNNER=1" >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          gmake --version | head -1
          ldid -V 2>&1 | head -1 || true
          cmake --version | head -1
          wget --version | head -1
          xcrun --sdk iphoneos --show-sdk-version
          echo "SDKPATH=$SDKPATH"

      - name: Build iOS IPA and TrollStore tIPA
        shell: bash
        run: |
          set -euo pipefail
          echo '#import <mach/mach.h>' | cat - Natives/JavaLauncher.m > temp
          mv temp Natives/JavaLauncher.m

          JDK_BASE_PATH="${{ steps.setup-java.outputs.path }}"
          export PATH="$JDK_BASE_PATH/bin:/opt/homebrew/bin:$PATH"
          export JAVA_HOME="$JDK_BASE_PATH"
          export BOOTJDK="$JDK_BASE_PATH/bin"
          export SLIMMED=1

          export CODE_SIGNING_ALLOWED=NO
          export CODE_SIGNING_REQUIRED=NO
          export CODE_SIGN_IDENTITY=""
          export CFLAGS="-Wno-error=implicit-function-declaration -Wno-error=int-to-pointer-cast ${CFLAGS:-}"
          export CXXFLAGS="-Wno-error=implicit-function-declaration -Wno-error=int-to-pointer-cast ${CXXFLAGS:-}"
          SIGN_FLAGS="CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="

          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }} $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)
          gmake -j"$(sysctl -n hw.ncpu)" dsym package PLATFORM=${{ matrix.platform }} TROLLSTORE_JIT_ENT=1 $SIGN_FLAGS 2> >(grep -v "vtool warning: code signature will be invalid" >&2)

      - name: List artifacts
        if: always()
        run: ls -la artifacts/ || true

      - name: Upload IPA artifact to workflow run
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: com.thenullastris.zenithlauncher-${{ matrix.platform_name }}
          path: artifacts/com.thenullastris.zenithlauncher-*-${{ matrix.platform_name }}.ipa
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Upload TrollStore tIPA artifact to workflow run
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: com.thenullastris.zenithlauncher-${{ matrix.platform_name }}-trollstore
          path: artifacts/com.thenullastris.zenithlauncher-*-${{ matrix.platform_name }}-trollstore.tipa
          retention-days: 90
          if-no-files-found: error
          compression-level: 0

      - name: Upload dSYM artifact to workflow run
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: com.thenullastris.zenithlauncher-dSYM
          path: artifacts/*.dSYM
          retention-days: 90
          if-no-files-found: warn
          compression-level: 0

      - name: Attach IPA and tIPA to the triggering release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*.ipa artifacts/*.tipa)
          if (( ${#files[@]} == 0 )); then
            echo 'No IPA or tIPA files were produced.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-logs
          path: |
            Natives/build/CMakeFiles/CMakeOutput.log
            Natives/build/CMakeFiles/CMakeError.log
          if-no-files-found: ignore
          retention-days: 7
