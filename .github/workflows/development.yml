name: Build TikDown IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number (e.g. 1.0.1)"
        required: false
        default: "1.0.0"

jobs:
  build:
    name: Build IPA
    runs-on: macos-15

    steps:
      - name: Checkout repo
        uses: actions/checkout@main

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@master
        with:
          xcode-version: '16.3'

      - name: Install build tools
        run: brew install xcodegen ldid

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TikDown.xcodeproj \
            -scheme TikDown \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Fakesign & package IPA
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "*.app" -type d | head -1)
          echo "App found at: $APP_PATH"

          # Fakesign with ldid (same as Zenith)
          ldid -S "$APP_PATH/$(basename $APP_PATH .app)"

          # Package into IPA
          mkdir -p "$RUNNER_TEMP/IPA/Payload"
          cp -r "$APP_PATH" "$RUNNER_TEMP/IPA/Payload/"
          cd "$RUNNER_TEMP/IPA"
          zip -r TikDown-unsigned.ipa Payload
          echo "IPA_PATH=$RUNNER_TEMP/IPA/TikDown-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@main
        with:
          name: site.KhinPhunnadet.TikDown-v${{ github.event.inputs.version }}-ios.ipa
          path: ${{ env.IPA_PATH }}
          retention-days: 30
